# Local two-player import. Keep your existing endpoints and registration key.
# Run this AFTER other configuration. Disable conflicting game modes and vMenu permission files.
sv_maxclients 2
set onesync on
sv_enforceGameBuild 3095

set coop_input_port 30126
setr coop_input_hud 0
setr brothers_experimental 0

# vMenu is restricted to the session host. Do NOT exec upstream permissions.cfg.
setr vmenu_use_permissions true
setr vmenu_menu_staff_only true
setr vmenu_menu_toggle_key "M"
setr vmenu_noclip_toggle_key "F2"
setr vmenu_disable_player_stats_setup true
setr vmenu_disable_spawning_as_default_character true
setr vmenu_enable_animals_spawn_menu false
setr vmenu_keep_spawned_vehicles_persistent false
setr vmenu_pvp_mode 0
setr vmenu_enable_weather_sync false
setr vmenu_enable_time_sync false
add_ace group.brothers_host "vMenu.Everything" allow
add_ace group.brothers_host "vMenu.Staff" allow
add_ace group.brothers_host brothers.playground allow
add_ace group.brothers_host brothers.manage allow
add_ace resource.brothers_admin command.add_principal allow
add_ace resource.brothers_admin command.remove_principal allow

# Disable stock competing spawn modes before the shared world starts.
stop mapmanager
stop basic-gamemode
stop fivem-map-skater
stop fivem-map-hipster

# Stock managers: no default map/gamemode that would replace our common spawn.
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure chat
ensure baseevents
ensure brothers_admin
ensure vMenu
ensure coop_input
ensure brothers_world
